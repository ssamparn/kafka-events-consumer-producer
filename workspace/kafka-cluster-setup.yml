services:
  kafka-1:
    image: confluentinc/cp-kafka:8.1.3
    hostname: kafka-1
    container_name: kafka-1
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - "./cluster/volumes/kafka/broker-1:/var/lib/kafka/data"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:19093,2@kafka-2:19093,3@kafka-3:19093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,DOCKER://:29092,CONTROLLER://:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:9092,DOCKER://host.docker.internal:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    networks:
      - kafka-events-consumer-producer

  kafka-2:
    image: confluentinc/cp-kafka:8.1.3
    hostname: kafka-2
    container_name: kafka-2
    ports:
      - "9093:9093"
      - "29093:29093"
    volumes:
      - "./cluster/volumes/kafka/broker-2:/var/lib/kafka/data"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:19093,2@kafka-2:19093,3@kafka-3:19093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9093,DOCKER://:29093,CONTROLLER://:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:9093,DOCKER://host.docker.internal:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    networks:
      - kafka-events-consumer-producer

  kafka-3:
    image: confluentinc/cp-kafka:8.1.3
    hostname: kafka-3
    container_name: kafka-3
    ports:
      - "9094:9094"
      - "29094:29094"
    volumes:
      - "./cluster/volumes/kafka/broker-3:/var/lib/kafka/data"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:19093,2@kafka-2:19093,3@kafka-3:19093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9094,DOCKER://:29094,CONTROLLER://:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:9094,DOCKER://host.docker.internal:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    networks:
      - kafka-events-consumer-producer

  kafka-topics-generator:
    image: confluentinc/cp-kafka:8.1.3
    entrypoint: ['/bin/sh', '-c']
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    networks:
      - kafka-events-consumer-producer
    command: |
      "
      # block until kafka is reachable
      echo -e 'Waiting for 25 seconds'
      sleep 25s &&
      kafka-topics --bootstrap-server kafka-1:19092 --list

      echo -e 'Deleting Previously Created Kafka Topics'
      kafka-topics --bootstrap-server kafka-1:19092 --topic test-topic --delete --if-exists
      kafka-topics --bootstrap-server kafka-1:19092 --topic item-event-topic --delete --if-exists

      echo -e 'Creating New Kafka Topics'
      kafka-topics --bootstrap-server kafka-1:19092 --create --if-not-exists --topic test-topic --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server kafka-1:19092 --create --if-not-exists --topic item-event-topic --replication-factor 3 --partitions 3

      echo -e 'Successfully created the following topics:'
      kafka-topics --bootstrap-server kafka-1:19092 --list"

networks:
  kafka-events-consumer-producer:
    driver: bridge