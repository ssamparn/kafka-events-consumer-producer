services:
  kafka:
    image: confluentinc/cp-kafka:8.1.3 # Confluent Kafka 8.1.3. Modern Kafka (KRaft mode only, no Zookeeper)
    hostname: kafka # container is reachable as kafka inside Docker network
    container_name: kafka # explicit container name (nice for debugging)
    ports:
      - "9092:9092" # external (localhost). Spring Boot app / local machine
      - "29092:29092" # docker host access. Other Docker tools / containers
    environment:
      # Required cluster ID for KRaft
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      # KRaft configuration
      KAFKA_NODE_ID: 1 # Unique ID of this broker. Needed even for single-node setup
      KAFKA_PROCESS_ROLES: broker,controller # This node acts as: Broker (handles messages). Controller (manages cluster metadata)
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093 # Defines controllers in cluster: [nodeId]@[controller-port]. Single-node → only one entry

      # Listener definitions. Defines where Kafka listens. This is the most complex but very important part.
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,DOCKER://:29092,CONTROLLER://:9093

      # This is what clients use to connect
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:9092,DOCKER://host.docker.internal:29092

      # Every listener must define a protocol. PLAINTEXT (no SSL)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT

      # Inter-broker + controller
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL # Brokers communicate with each other via: INTERNAL://
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER # Controller uses: CONTROLLER://

      # Kafka single node safety configs: Required because: Kafka by default expect multiple brokers. Since we only have 1 node, these configs prevent startup failures.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

    networks:
      - kafka-events-consumer-producer

networks:
  kafka-events-consumer-producer:
    driver: bridge
